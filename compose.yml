services:
  liquibase-schema:
    image: liquibase/liquibase:4.32.0
    volumes:
      - ./changelog:/liquibase/changelog
    command: >
      --driver=org.postgresql.Driver
      --changelog-file=changelog/db.changelog.xml
      --url=jdbc:postgresql://postgres:5432/trade-commodity-codes
      --username=postgres
      --password=postgres
      update
    networks:
      - cdp-tenant

  liquibase-data:
    image: liquibase/liquibase:4.32.0
    depends_on:
      liquibase-schema:
        condition: service_completed_successfully
    volumes:
      - ./data:/liquibase/data
      - ./data/csv:/liquibase/data/csv
    command: >
      --driver=org.postgresql.Driver
      --changelog-file=data/db.changelog.xml
      --url=jdbc:postgresql://postgres:5432/trade-commodity-codes
      --username=postgres
      --password=postgres
      --log-level=debug
      update
    networks:
      - cdp-tenant

  trade-commodity-codes:
    build:
      context: .
      target: development
    ports:
      - '8086:8086'
      - '5006:5005' # Java debug port
    depends_on:
      liquibase-schema:
        condition: service_completed_successfully
      liquibase-data:
        condition: service_completed_successfully
    volumes:
      - './changelog:/app/changelog'
    environment:
      # Server
      PORT: 8086

      # Service Identity
      SERVICE_VERSION: 0.0.0-local
      ENVIRONMENT: local

      # Postgres
      POSTGRES_WRITE_HOSTNAME: postgres

      # AWS (via LocalStack)
      LOCALSTACK_ENDPOINT: http://localstack:4566
      AWS_REGION: eu-west-2
      AWS_EMF_ENVIRONMENT: Local
      AWS_EMF_NAMESPACE: trade-commodity-codes
      AWS_EMF_SERVICE_TYPE: SpringBootApp
      AWS_EMF_WRITE_TO_STDOUT: true

      # Logging
      LOG_LEVEL: DEBUG

      # Metrics (disabled locally)
      ENABLE_METRICS: true

      # Spring profile (dev = exposes debugging actuator endpoints)
      SPRING_PROFILES_ACTIVE: local

      # Liquibase configuration for dev profile
      LIQUIBASE_CHANGELOG_PATH: changelog/db.changelog.xml

      # Java Debug (optional - uncomment to enable remote debugging)
      # JAVA_TOOL_OPTIONS: -agentlib:jdwp=transport=dt_socket,server=y,suspend=n,address=*:5005
    networks:
      - cdp-tenant
    # Note: No volume mounts for Java (requires rebuild for code changes)
    # For faster development, use 'mvn spring-boot:run' directly on host

################################################################################

networks:
  cdp-tenant:
    external: true
    name: cdp-tenant
